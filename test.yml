name: test

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done && node --check worker/worker.js
      - name: Engine tests
        run: node test/engine.test.js && node test/sync.test.js && node test/worker.test.mjs
